
name: E-commerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend Install and Check
        working-directory: ./backend
        run: |
          npm ci
          node --check server.js
          node --check db.js

      - name: Frontend Install
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend Build
        working-directory: ./frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }} \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }} \
            ./frontend

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan Backend Image
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }}

      - name: Scan Frontend Image
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Backend Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }}

      - name: Push Frontend Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }}
